# Optional Failure Memory coverage gate (opt-in).
# Does not replace the main regression gate; uses local SQLite artifacts only.
name: Failure Memory coverage

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "failure_memory/**"
      - ".agenteval/**"
      - "examples/failure_memory_demo*/**"

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Init DB and run demo artifacts (zero network)
        run: |
          python examples/failure_memory_demo_v21/run_demo.py --workdir "$RUNNER_TEMP/fm" --keep
          python -m agenteval memory coverage --db "$RUNNER_TEMP/fm/failure-memory.db" --json > "$RUNNER_TEMP/fm/coverage.json" || true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-memory-coverage
          path: ${{ runner.temp }}/fm/coverage.json
