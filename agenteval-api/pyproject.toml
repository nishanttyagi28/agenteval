[project]
name = "agenteval-api"
version = "0.1.0"
description = "Stateless FastAPI layer over AgentEval SQL scan/diff"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "python-multipart==0.0.20",
  "nishanttyagi-agenteval>=0.1.1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
