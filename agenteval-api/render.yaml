# Render Blueprint — one-click deploy of the AgentEval SQL API (free tier).
#
# In the Render dashboard: New → Blueprint → connect this GitHub repo.
# Or create a Web Service manually using the settings documented in
# DEPLOY.md / the root deployment steps.
#
# Note: free-tier Web Services spin down after idle; cold starts are fine
# for a portfolio demo.

services:
  - type: web
    name: agenteval-api
    runtime: docker
    plan: free
    # Build context = repository root so the Dockerfile can install the
    # local nishanttyagi-agenteval package (SQL Tiers 1–5).
    dockerfilePath: ./agenteval-api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
